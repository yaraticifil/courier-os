services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: courierdb
      POSTGRES_USER: courier
      POSTGRES_PASSWORD: courier123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr 0.0.0.0:9092
      - --advertise-kafka-addr localhost:9092
    ports:
      - "9092:9092"

  osrm:
    image: osrm/osrm-backend:latest
    ports:
      - "5000:5000"
    command: osrm-routed --algorithm mld /data/map.osrm
    volumes:
      - osrmdata:/data

  dispatch:
    build:
      context: ../dispatch-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
    depends_on:
      - postgres

volumes:
  pgdata:
  osrmdata:
